<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title description">
  <title id="title">LLM engineering capabilities</title>
  <desc id="description">Six general areas of language-model engineering: behavior and role, context and memory, multilingual quality, model selection, inference and KV cache, and evaluation and regression.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14232f"/>
      <stop offset="1" stop-color="#08131b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172d39"/>
      <stop offset="1" stop-color="#10212d"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#70d9cb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#70d9cb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#87b6bf" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1440" height="800" rx="24" fill="url(#background)"/>
  <rect width="1440" height="800" rx="24" fill="url(#grid)"/>
  <ellipse cx="1270" cy="70" rx="420" ry="290" fill="url(#light)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
