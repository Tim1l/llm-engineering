    <g fill="#eff7fa" font-size="27" font-weight="700" letter-spacing="-0.5">
      <text x="160" y="215">Behavior &amp; Role</text>
      <text x="828" y="215">Context &amp; Memory</text>
      <text x="160" y="393">Multilingual Quality</text>
      <text x="828" y="393">Model Selection</text>
      <text x="160" y="571">Inference &amp; KV Cache</text>
      <text x="828" y="571">Evaluation &amp; Regression</text>
    </g>
    <g fill="#b1c7d1" font-size="19">
      <text x="160" y="255">Keep personality, tone, and response behavior</text>
      <text x="160" y="284">aligned with the product.</text>
      <text x="828" y="255">Maintain relevant facts and preferences</text>
      <text x="828" y="284">across longer conversations.</text>
      <text x="160" y="433">Preserve the role and key facts</text>
      <text x="160" y="462">when the language changes.</text>
      <text x="828" y="433">Match model choices to task quality,</text>
      <text x="828" y="462">hardware, and operating requirements.</text>
      <text x="160" y="611">Balance latency, GPU memory, and quality</text>
      <text x="160" y="640">through inference optimization.</text>
      <text x="828" y="611">Compare changes on repeatable scenarios</text>
      <text x="828" y="640">with human and agent-based review.</text>
    </g>
    <path d="M64 725H1376" stroke="#294753"/>
    <text x="720" y="761" font-size="18" fill="#8eafb9" text-anchor="middle">Engineering capabilities · General overview</text>
  </g>
  <rect x="0.5" y="0.5" width="1439" height="799" rx="23.5" fill="none" stroke="#3d5b66" stroke-opacity="0.55"/>
