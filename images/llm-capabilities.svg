    <text x="86" y="73" font-size="17" letter-spacing="2.7" fill="#9fc0ca">BEHAVIOR · QUALITY · PERFORMANCE</text>
    <text x="62" y="131" font-size="43" font-weight="700" letter-spacing="-1.2" fill="#f1f7fa">LLM ENGINEERING CAPABILITIES</text>

    <g fill="url(#panel)" stroke="#2a4857" stroke-width="1.2">
      <rect x="64" y="168" width="644" height="160" rx="22"/>
      <rect x="732" y="168" width="644" height="160" rx="22"/>
